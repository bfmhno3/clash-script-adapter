<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Clash Script Adapter</title>
  <desc id="hero-desc">One subscription config is compiled into lite, default, full, and ai global extend scripts.</desc>

  <rect width="1200" height="360" fill="#0b0f14"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2.4" fill="#7aa2f7">CLASH / MIHOMO CONFIG GENERATOR</text>

    <text x="56" y="126" font-size="60" font-weight="700" fill="#f2f5f7">一份订阅，</text>
    <text x="56" y="196" font-size="60" font-weight="700" fill="#f2f5f7">四种脚本。</text>
    <text x="56" y="240" font-size="21" fill="#b6c2cf">四个预设，一套模块，输出单文件全局扩展脚本。</text>
    <text x="56" y="272" font-size="20" fill="#8b98a5">节点清洗 / lean fake-ip DNS / 平台感知 TUN</text>
    <text x="56" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#8b98a5">4 presets / Boa-safe / 1 file each</text>
  </g>

  <g>
    <rect x="640" y="44" width="504" height="272" rx="16" fill="#11161d" stroke="#26303a" stroke-width="1"/>
    <text x="664" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#8b98a5">src/presets  ->  dist</text>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <rect x="664" y="96" width="456" height="40" rx="10" fill="#151b23" stroke="#26303a" stroke-width="1"/>
      <text x="682" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f2f5f7">lite</text>
      <text x="790" y="121" font-size="16" fill="#8b98a5">3 regions / no TUN</text>
      <text x="990" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7aa2f7">lite.min.js</text>

      <rect x="664" y="146" width="456" height="40" rx="10" fill="#151b23" stroke="#26303a" stroke-width="1"/>
      <text x="682" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f2f5f7">default</text>
      <text x="790" y="171" font-size="16" fill="#8b98a5">6 regions / sniffer</text>
      <text x="990" y="171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7aa2f7">default.min.js</text>

      <rect x="664" y="196" width="456" height="40" rx="10" fill="#151b23" stroke="#26303a" stroke-width="1"/>
      <text x="682" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f2f5f7">full</text>
      <text x="790" y="221" font-size="16" fill="#8b98a5">16 regions / TUN</text>
      <text x="990" y="221" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7aa2f7">full.min.js</text>

      <rect x="664" y="246" width="456" height="40" rx="10" fill="#151b23" stroke="#26303a" stroke-width="1"/>
      <text x="682" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#f2f5f7">ai</text>
      <text x="790" y="271" font-size="16" fill="#8b98a5">fixed exit / TUN</text>
      <text x="990" y="271" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e0af68">ai.min.js</text>
    </g>
  </g>
</svg>
